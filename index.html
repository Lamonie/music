<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Site de Artistas</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 250px;
      font-size: 16px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #buscarBtn {
      background: green;
      color: white;
    }

    #resultado {
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Buscar Artistas 🎤</h1>

  <input type="text" id="artista" placeholder="Digite o nome do artista">
  <br>
  <button id="buscarBtn" onclick="buscar()">Buscar</button>

  <div id="resultado"></div>

  <script>
    function buscar() {
      let nome = document.getElementById("artista").value;

      let dados = {
        "Zezé de Camargo e Luciano": "Tem mais de 25 álbuns e centenas de músicas.",
        "Gusttavo Lima": "Tem mais de 10 álbuns e muitos hits.",
        "Anitta": "Possui vários álbuns e carreira internacional."
      };

      let resultado = dados[nome] || "Artista não encontrado.";

      document.getElementById("resultado").innerText = resultado;
    }
  </script>

</body>
</html>
